name: harness-4step
version: "3.0.0"
description: |
  Harness 4-Step enforcement plugin v3. Blocks write_file/patch/skill_manage
  calls in every session: direct tool edits can never substitute for a Step 3
  CLI execution — code changes are only permitted through run_cli.py --step step3.

  Uses pre_tool_call hook to block direct file modifications unconditionally
  (there is no step_done unlock for direct edits). Uses post_tool_call hook to
  track run_cli.py success for step ordering/logging only (delegate_task alone
  no longer marks step_done). Supports TTL-based cleanup and session limits.
author: "Hermes Agent"
hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
config:
  enabled: true
  ttl_minutes: 30
  max_sessions: 200
  exempt_tools: []
  exempt_goal_patterns: []
