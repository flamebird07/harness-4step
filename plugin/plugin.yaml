name: harness-4step
version: "3.0.0"
description: |
  Harness 4-Step enforcement plugin v3. Blocks write_file/patch/skill_manage
  calls until run_cli.py has been successfully executed in the same session,
  enforcing real CLI execution via the 4-step harness.
  
  Uses pre_tool_call hook to block premature file modifications. Uses
  post_tool_call hook to track run_cli.py success (delegate_task alone no
  longer marks step_done). Supports TTL-based cleanup and session limits.
author: "Hermes Agent"
hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
config:
  enabled: true
  ttl_minutes: 30
  max_sessions: 200
  exempt_tools: [write_file, patch, skill_manage]
  exempt_goal_patterns: []
